<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo to Document · CP Scan</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="nav"></div>
<main>
<h1>Photo to Document</h1>
<p class="hint">Printed or handwritten pages become one editable document. Bold, lists, spacing and tables are kept, and you can edit everything before you download.</p>
<div class="card">
  <label>Photos</label>
  <input type="file" id="files" accept="image/*" multiple>
  <label>Type of writing</label>
  <select id="mode">
    <option value="printed">Printed (copy exactly)</option>
    <option value="handwritten">Handwritten (read carefully, then type up properly)</option>
  </select>
  <label>Document type (handwritten only)</label>
  <select id="kind">
    <option value="auto">Auto</option><option value="letter">Letter</option><option value="notes">Notes</option>
    <option value="report">Report</option><option value="minutes">Meeting minutes</option>
    <option value="essay">Essay</option><option value="cv">CV</option><option value="list">List or checklist</option>
  </select>
</div>
<div id="thumbs" class="grid"></div>
<button class="primary block" id="go" onclick="run()">Read photos</button>
<div id="status"></div>
<div class="pbar"><i id="pfill"></i></div>
<div id="out" hidden></div>
</main>
<script src="common.js"></script>
<script src="scan.js"></script>
<script src="editor.js"></script>
<script>
nav();
mountResult();
var pager = Pager($('thumbs'), { mode: 'original' });
$('files').onchange = async function () {
  var files = Array.from(this.files).sort(byName);
  for (var i = 0; i < files.length; i++) {
    status('Loading ' + (i + 1) + ' of ' + files.length + '...');
    await pager.add(await fileToDataUrl(files[i], 2400, 0.9));
  }
  status('');
  this.value = '';
};
async function run() {
  if (!pager.items.length) { status('Choose photos first.'); return; }
  $('go').disabled = true;
  var mode = $('mode').value, imgs = [];
  for (var i = 0; i < pager.items.length; i++) imgs.push(await shrinkData(pager.items[i].out, 1600, 0.85));
  var texts = await readImages(imgs, mode);
  if (mode === 'handwritten') texts = await polishAll(texts, $('kind').value);
  status('Done. Edit the document, then download.');
  newDoc(texts.join('\n'), 'document');
  $('go').disabled = false;
}
</script>
</body>
</html>
